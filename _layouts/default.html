<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.title }}</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="canonical" href="{{ site.url }}{{ page.url | remove: 'index.html' }}">
    <link rel="preload" href="{{ '/assets/fonts/ubuntu-sans-latin-wght-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>

  <body class="{% if page.layout == 'page' %}inner{% else %}home{% endif %}">
    {{ content }}
  </body>
</html>
